[project]
name = "wyndpy"
version = "0.1.1"
description = "Generic, pluggable content-retrieval library — role-based fetch/search/parse adapters, usable standalone, as tool-calls, or via MCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Wyndpy contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# These extras install vendor SDKs. The matching adapters are still stubs
# (NotImplementedError). build_router() refuses them unless allow_stubs=True.
firecrawl = ["firecrawl-py>=1.0"]
exa = ["exa-py>=1.0"]
llamaparse = ["llama-parse>=0.5"]
postgres = ["asyncpg>=0.29"]
mcp = ["mcp>=1.0"]
all = ["wyndpy[firecrawl,exa,llamaparse,postgres,mcp]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "build>=1.2"]

[project.entry-points."wyndpy.fetch"]
httpx = "wyndpy.fetch.httpx_adapter:HttpxFetcher"
firecrawl = "wyndpy.fetch.firecrawl_adapter:FirecrawlFetcher"

[project.entry-points."wyndpy.search"]
exa = "wyndpy.search.exa_adapter:ExaSearcher"

[project.entry-points."wyndpy.parse"]
llamaparse = "wyndpy.parse.llamaparse_adapter:LlamaParseParser"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wyndpy*"]

[tool.setuptools.package-data]
wyndpy = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "llm_eval: adapter output-quality eval against recorded cassettes; not run in default `pytest` (see tests/eval/README.md)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # not yet strict — adapters/stubs still evolving
