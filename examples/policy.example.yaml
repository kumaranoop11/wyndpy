schema_version: 1

# Working consumer policy: httpx only. Do not list firecrawl / exa /
# llamaparse here — those adapters are stubs (NotImplementedError) and
# build_router() refuses them unless allow_stubs=True.
roles:
  fetch: [httpx]
  # search: [exa]          # stub — leave out until the Exa adapter is wired
  # parse: [llamaparse]    # stub — leave out until LlamaParse is wired

search:
  candidate_count: 10

# Escalation to stub adapters is omitted. Add rules only after those
# adapters are implemented (or pass allow_stubs=True in tests).
escalation_rules: []

discovery:
  new_items: every_cycle
  existing_items:
    cadence: monthly
    trigger_on: [fetch_failure, stale_after_days:90]

trust:
  strategy: allowlist
  allow: ["*.example.com"]
  require_review: true

unresolved_handling: leave_unresolved

registry_backend: memory
scheduling_backend: cron

cost_caps:
  exa: 50/day
  firecrawl: 200/day
  llamaparse: 100/day

rate_limits:
  exa: 5/minute
  firecrawl: 10/minute
